<header class="header-container glass-panel">
  <div class="header-content">
    <div class="brand-link-group">
      <div class="logo-group">
        <!-- Logo GEO-URP redirige a https://geourp.org/ -->
        <a href="https://geourp.org/" target="_blank" rel="noopener noreferrer" class="logo-anchor" title="Ir a GEO-URP Oficial">
          <img src="assets/images/GEOURPLOGO.png" alt="Geo-URP Logo" class="brand-logo-img geo-logo" />
        </a>

        <!-- Logo URP redirige a https://www.urp.edu.pe/ -->
        <a href="https://www.urp.edu.pe/" target="_blank" rel="noopener noreferrer" class="logo-anchor" title="Ir a la Universidad Ricardo Palma">
          <img src="assets/images/URP.png" alt="URP Logo" class="brand-logo-img urp-logo" />
        </a>

        <!-- Título CONEIC CUSCO 2026 redirige a Inicio -->
        <a routerLink="/" class="title-anchor" title="Cronograma CONEIC 2026">
          <div class="brand-title">
            <span class="highlight">CONEIC</span> CUSCO 2026
          </div>
        </a>
      </div>
    </div>

    <div class="header-right">
      <nav class="nav-links">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
          <span>Cronograma</span>
        </a>

        <a routerLink="/mi-calendario" routerLinkActive="active" class="nav-item">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
          <span>Mi Agenda</span>
        </a>

        <a *ngIf="authService.isAdmin()" routerLink="/admin" routerLinkActive="active" class="nav-item admin-item">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          <span>Admin</span>
        </a>
      </nav>

      <div class="user-action">
        <ng-container *ngIf="authService.currentUser(); else guestTpl">
          <div class="user-pill">
            <span class="user-name">{{ authService.currentUser()?.nombre }}</span>
            <button (click)="openChangePasswordModal()" class="btn-change-pass" title="Cambiar Contraseña">
              🔑
            </button>
            <button (click)="logout()" class="btn-logout" title="Cerrar Sesión">
              <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
              <span>Salir</span>
            </button>
          </div>
        </ng-container>
        <ng-template #guestTpl>
          <a routerLink="/login" class="btn btn-primary btn-sm">Ingresar</a>
        </ng-template>
      </div>
    </div>
  </div>

  <!-- MODAL CAMBIAR CONTRASEÑA -->
  <div *ngIf="showChangePasswordModal" class="modal-backdrop" (click)="closeChangePasswordModal()">
    <div class="modal-dialog modal-sm" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h4>🔒 Cambiar Mi Contraseña</h4>
        <button (click)="closeChangePasswordModal()" class="modal-close-btn">✕</button>
      </div>

      <div class="modal-body">
        <div *ngIf="messageSuccess" class="alert alert-success mb-3">
          <span>✅ {{ messageSuccess }}</span>
        </div>
        <div *ngIf="messageError" class="alert alert-error mb-3">
          <span>⚠️ {{ messageError }}</span>
        </div>

        <div class="form-group mb-3">
          <label>Contraseña Actual *</label>
          <input type="password" [(ngModel)]="passwordActual" class="form-control" placeholder="••••••••">
        </div>

        <div class="form-group mb-3">
          <label>Nueva Contraseña *</label>
          <input type="password" [(ngModel)]="passwordNueva" class="form-control" placeholder="Mínimo 6 caracteres">
        </div>
      </div>

      <div class="modal-footer">
        <button (click)="closeChangePasswordModal()" class="btn btn-secondary">Cancelar</button>
        <button (click)="guardarCambioPassword()" [disabled]="isLoading" class="btn btn-primary">
          {{ isLoading ? 'Guardando...' : 'Actualizar Clave' }}
        </button>
      </div>
    </div>
  </div>
</header>
