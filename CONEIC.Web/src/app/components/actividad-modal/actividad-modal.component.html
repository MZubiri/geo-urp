<div class="modal-overlay" (click)="onClose()">
  <div class="modal-content" (click)="$event.stopPropagation()" *ngIf="actividad">
    <div class="modal-header">
      <div class="modal-badges">
        <span class="badge-category">{{ actividad.apartadoNombre }}</span>
        <span *ngIf="actividad.urpParticipa" class="badge-urp">
          💚 URP Participa
        </span>
      </div>
      <button (click)="onClose()" class="btn-close">&times;</button>
    </div>

    <h2 class="actividad-title">{{ actividad.nombre }}</h2>

    <div class="time-box">
      <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      <div>
        <div class="date-text">{{ formatDate(actividad.horaInicio) }}</div>
        <div class="hours-text">{{ formatTime(actividad.horaInicio) }} - {{ formatTime(actividad.horaFin) }}</div>
      </div>
    </div>

    <p class="actividad-desc" *ngIf="actividad.descripcion">
      {{ actividad.descripcion }}
    </p>

    <!-- Dynamic JSON Extra Fields -->
    <div class="extra-fields-grid" *ngIf="extraFields.length > 0">
      <div class="extra-field-card" *ngFor="let item of extraFields">
        <span class="field-key">{{ item.key }}</span>
        <span class="field-value">{{ item.value }}</span>
      </div>
    </div>

    <div class="modal-actions">
      <button (click)="onToggleAgenda()" [class.btn-danger]="isSaved" [class.btn-primary]="!isSaved" class="btn btn-block">
        <svg *ngIf="!isSaved" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
        <svg *ngIf="isSaved" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
        <span>{{ isSaved ? 'Quitar de Mi Calendario' : 'Agregar a Mi Calendario' }}</span>
      </button>

      <button (click)="downloadIcs()" class="btn btn-outline btn-block">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
        <span>Exportar a calendario</span>
      </button>
    </div>
  </div>
</div>
