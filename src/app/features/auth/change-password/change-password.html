<section class="change-password-wrapper">
  <div class="change-password-card">
    <h1 class="titulo">Cambiar contrasena</h1>
    <p class="sub">Actualiza tu clave de acceso.</p>

    <input
      type="password"
      placeholder="Nueva contrasena"
      [(ngModel)]="newPassword"
      autocomplete="new-password"
    />

    <input
      type="password"
      placeholder="Confirmar contrasena"
      [(ngModel)]="confirmPassword"
      autocomplete="new-password"
    />

    <button type="button" class="btn-primary" (click)="guardar()" [disabled]="cargando">
      {{ cargando ? 'Guardando...' : 'Guardar contrasena' }}
    </button>

    <button type="button" class="btn-secondary" (click)="irInicio()">Volver al inicio</button>

    <p class="error" *ngIf="error">{{ error }}</p>
  </div>

  <div class="toast-success" *ngIf="toastMessage">{{ toastMessage }}</div>
</section>
