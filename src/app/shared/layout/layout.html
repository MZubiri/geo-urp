<header class="topbar" *ngIf="mostrarTopbar">
  <div class="topbar-inner">
    <div class="brand" routerLink="/" tabindex="0">
      <strong>GEO-URP</strong>
      <span>Investigación · Ciencia · Comunidad</span>
    </div>

    <nav class="nav-links">
      <a routerLink="/directorio" routerLinkActive="activo">Directorio</a>
      <a routerLink="/eventos" routerLinkActive="activo">Eventos</a>
      <a routerLink="/login" routerLinkActive="activo">Login</a>
      <button type="button" (click)="cerrarSesion()" *ngIf="authService.isAuthenticated()">Salir</button>
    </nav>
  </div>
</header>

<main class="main-content">
  <router-outlet></router-outlet>
</main>
